# 判定のルール（更新版）：入力の組み合わせ → 観点ごとの3段階（要確認・注意・問題なさそう）と理由1行。
# 道具は断定しない。「問題なさそう」は、根拠の記録（照合が一致、OCRなら人の確認が済）があるときだけ。
#
# 判定の順番（lib/hantei-core.mjs が守る。ルールより先に効く）
#   1. その観点の「判定に使う入力」に「分からない」があれば → 要確認
#   2. 未収録の自治体なら → 要確認（窓口・適用条例は除く）
#   3. 下のルールを上から見て、最初に当てはまったもの
#   4. どれにも当てはまらなければ → 要確認（「資料で判断できる記載がない」）
#   「該当なし」は入力から見て関係しない観点。画面には出さない。
#
# 条件の書き方
#   屋外：屋外広告物の基準の自治体。都道府県の条例なら「広島県」、市の独自条例なら「広島県福山市」
#   入力名: 値 か [値, 値]。表示面積: {超: 10} など数で比べる
#   根拠：data/基準/ の記録 id（自治体名-番号-連番）
入力:
  種類: [ 壁面, 袖, 屋上, 自立, その他 ]
  表示面積: "数（㎡、合計）か 分からない"
  高さ4m超: [ はい, いいえ, 分からない ]
  板面替え: [ しない, 主たる内容以外だけ, 店名・ロゴも替える, 分からない ]
  表示者の変更: [ ない, ある, 分からない ]

判定:
  - 観点: 窓口
    規則:
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "申請は掲出場所の市町の担当課（上の欄）。屋外広告業の登録は県", 根拠: [ 広島県-U1-01, 広島県-U1-02, 広島県-U1-03 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 問題なさそう, 理由: "福山市の土木管理課（松永・北部・神辺・沼隈の地区は各建設産業課）", 根拠: [ 広島県福山市-U1-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 問題なさそう, 理由: "継続許可（更新）は区役所の維持管理課（市から通知書が届く）", 根拠: [ 広島県広島市-U1-01 ] }
  - 観点: 適用条例
    規則:
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "広島県屋外広告物条例がかかる（申請先は市町）", 根拠: [ 広島県-U2-01, 広島県-U1-01 ] }
      - { 屋外: [ 広島県福山市, 広島県広島市 ], 判定: 問題なさそう, 理由: "市の屋外広告物条例がかかる（県条例ではない）", 根拠: [ 広島県-U2-01 ] }
  - 観点: 許可期間と更新
    規則:
      - { 屋外: [ 広島県 ], 判定: 注意, 理由: "許可は1年以内。続けるなら毎年許可申請をし直す（前回と同じ内容なら添付書類を省略できる）", 根拠: [ 広島県-U3-01, 広島県-U3-02 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 注意, 理由: "許可は1年（立看板・のぼり等は1か月）。満了後も出すなら許可更新申請書（2部）", 根拠: [ 広島県福山市-U3-01, 広島県福山市-U3-02 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 注意, 理由: "許可は1年以内。毎年、区役所から届く通知書・納付書で手数料を納め、継続許可を申請", 根拠: [ 広島県広島市-U3-01, 広島県広島市-U3-02 ] }
  - 観点: 点検報告
    規則:
      - { 屋外: [ 広島県 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "設置から5年たった時点の許可、以降3年ごとに安全点検報告書（資格のある管理者が点検）", 根拠: [ 広島県-U4-01, 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "設置から5年たった時点の許可、以降3年ごとに安全点検報告書（資格のある管理者が点検）", 根拠: [ 広島県-U4-01, 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "高さ4m以下・10㎡以下なら点検報告の対象外の読み方（設置からの年数は窓口で確認）", 根拠: [ 広島県-U4-02 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "設置6年目の更新から3年ごとに安全点検報告書（許可満了日以前3か月以内のもの）", 根拠: [ 広島県福山市-U4-01, 広島県福山市-U4-02, 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "設置6年目の更新から3年ごとに安全点検報告書（許可満了日以前3か月以内のもの）", 根拠: [ 広島県福山市-U4-01, 広島県福山市-U4-02, 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 問題なさそう, 理由: "高さ4m以下・10㎡以下なら管理者・点検報告の対象外の読み方", 根拠: [ 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "6年目の継続許可から安全点検報告書。1度出すと次の2年は免除（3年ごと）", 根拠: [ 広島県広島市-U4-01, 広島県広島市-U4-02, 広島県広島市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "6年目の継続許可から安全点検報告書。1度出すと次の2年は免除（3年ごと）", 根拠: [ 広島県広島市-U4-01, 広島県広島市-U4-02, 広島県広島市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 問題なさそう, 理由: "広告塔・広告板で高さ4m以下・10㎡以下なら点検報告の対象外の読み方（アーチ看板は対象）", 根拠: [ 広島県広島市-U5-01 ] }
  - 観点: 管理者
    規則:
      - { 屋外: [ 広島県 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者が点検する（屋外広告士・建築士・電気工事士など）", 根拠: [ 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者が点検する（屋外広告士・建築士・電気工事士など）", 根拠: [ 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 判定: 要確認, 理由: "申請書には管理者を書く。4m以下・10㎡以下で資格が要るかは窓口で確認", 根拠: [ 広島県-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者を置く（屋外広告士・建築士・電気工事士・電気主任技術者・講習修了者）。置いたら設置届", 根拠: [ 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者を置く（屋外広告士・建築士・電気工事士・電気主任技術者・講習修了者）。置いたら設置届", 根拠: [ 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 問題なさそう, 理由: "高さ4m以下・10㎡以下なら資格のある管理者の設置義務の対象外の読み方", 根拠: [ 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "広告塔・広告板で高さ4m超か10㎡超（アーチ看板も）は資格のある管理者を置く", 根拠: [ 広島県広島市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "広告塔・広告板で高さ4m超か10㎡超（アーチ看板も）は資格のある管理者を置く", 根拠: [ 広島県広島市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 問題なさそう, 理由: "広告塔・広告板で4m以下・10㎡以下なら管理者の設置義務の対象外の読み方", 根拠: [ 広島県広島市-U5-01 ] }
  - 観点: 手数料
    規則:
      - { 屋外: [ 広島県 ], 判定: 要確認, 理由: "手数料の額は条例（第21条の6）にあり、読んだ資料に無い。申請先の市町で確認", 根拠: [ 広島県-U6-00 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 表示面積: { 以下: 10 } }, 判定: 注意, 理由: "広告板・広告塔は1個につき光源あり1,780円・光源なし1,060円（10㎡以下）", 根拠: [ 広島県福山市-U6-01 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 注意, 理由: "広告板・広告塔は1個ごとに面積と光源の有無で決まる（10㎡超30㎡以下は4,950円・3,720円）", 根拠: [ 広島県福山市-U6-01 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 表示面積: { 以下: 10 } }, 判定: 注意, 理由: "平看板・広告塔は1個につき光源あり1,780円・光源なし1,060円（10㎡以下）", 根拠: [ 広島県広島市-U6-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 注意, 理由: "1個ごとに面積と光源の有無で決まる。一部を除却したら届を出せば次の継続許可は減った面積で計算", 根拠: [ 広島県広島市-U6-01, 広島県広島市-U6-02 ] }
  - 観点: 変更届
    規則:
      - { 条件: { 表示者の変更: ない }, 判定: 該当なし }
      - { 屋外: [ 広島県 ], 判定: 注意, 理由: "管理者が変われば管理者変更届（5日以内）。表示者の変更の扱いは窓口で確認", 根拠: [ 広島県-U7-01 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 注意, 理由: "設置者・管理者が変われば変更届（管理者の変更は資格の証明の写しを付ける）", 根拠: [ 広島県福山市-U7-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 要確認, 理由: "表示者・管理者の変更の届出は、読んだ手引きの章に見当たらない", 根拠: [ 広島県広島市-U7-00 ] }
  - 観点: 板面替え
    規則:
      - { 条件: { 板面替え: しない }, 判定: 該当なし }
      - { 屋外: [ 広島県 ], 判定: 要確認, 理由: "軽微な変更の範囲は読んだ資料に無い（変更の許可は条例第14条）", 根拠: [ 広島県-U8-00 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 板面替え: 主たる内容以外だけ }, 判定: 注意, 理由: "形状を大きく変えず面積の変更10%未満、基本を変えない塗替えなどは軽微（許可不要）の読み方。軽微でも更新の申請に書類を付ける", 根拠: [ 広島県福山市-U8-01 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 注意, 理由: "デザインを替えるなら変更の許可の読み方。2026年4月から変更手数料が要り、許可期間は変更の許可日から1年に", 根拠: [ 広島県福山市-U8-01, 広島県福山市-U8-02, 広島県福山市-U6-02 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 板面替え: 店名・ロゴも替える }, 判定: 注意, 理由: "変更・改造は変更許可申請（規則第4条の軽微な変更を除く）", 根拠: [ 広島県広島市-U8-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 要確認, 理由: "軽微な変更（規則第4条）なら変更許可は不要。範囲は手引きの章に無いので窓口で確認", 根拠: [ 広島県広島市-U8-01 ] }
  - 観点: 旧基準の看板
    規則:
      - { 屋外: [ 広島県 ], 判定: 要確認, 理由: "経過措置（条例第7条）の中身は読んだ資料に無い", 根拠: [ 広島県-U9-00 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 要確認, 理由: "経過措置は読んだ福山市の資料に無い", 根拠: [ 広島県福山市-U9-00 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 要確認, 理由: "経過措置は読んだ手引きの章に無い", 根拠: [ 広島県広島市-U9-00 ] }
