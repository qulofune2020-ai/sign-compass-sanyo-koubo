# 観点（更新版）：看板の許可を「更新」するときに、自治体ごとに違いが出る項目。資料はこの観点ごとに読む。
# 埼玉版（新規の判定・34観点）から、更新に効くものだけを残し、点検と管理者を分けた。
#
# 項目
#   番号 / id（記録・判定から指す名前。変えない）/ 群 / 軸（屋外広告物のみ）/ 表示名 /
#   資料で探すもの / 電話で聞く文（画面でコピーできる）/ 判定に使う入力
#
# 入力（画面で選ぶもの。住所・依頼者・施主の情報は入れない）
#   市町村 / 種類 / 表示面積 / 高さ4m超 / 板面替え / 表示者の変更
#   （「分からない」を選んだ入力が効く観点は、必ず「要確認」）

観点:
  - 番号: U1
    id: 窓口
    群: 入口
    軸: 屋外広告物
    表示名: "窓口"
    資料で探すもの: "更新の申請を出す担当課と電話（県の出先か、市か）"
    電話で聞く文: "屋外広告物の許可の更新は、どの課に申請しますか"
    判定に使う入力: [市町村]
  - 番号: U2
    id: 適用条例
    群: 入口
    軸: 屋外広告物
    表示名: "適用される屋外広告物条例"
    資料で探すもの: "都道府県の条例か、市の独自条例か（政令市・中核市・条例で事務を移した市町村）"
    電話で聞く文: "この場所の看板には、市の屋外広告物条例と県の条例のどちらがかかりますか"
    判定に使う入力: [市町村]
  - 番号: U3
    id: 許可期間と更新
    群: 更新
    軸: 屋外広告物
    表示名: "許可期間と更新の申請"
    資料で探すもの: "許可の期間（種類ごと）、更新の申請をいつまでに出すか、期限を過ぎたときの扱い"
    電話で聞く文: "許可の期限の何日前までに更新を申請すればよいですか。期限を過ぎたら新規の申請になりますか"
    判定に使う入力: [市町村, 種類]
  - 番号: U4
    id: 点検報告
    群: 更新
    軸: 屋外広告物
    表示名: "安全点検の報告"
    資料で探すもの: "更新の申請に点検結果を付けるか、点検はいつまでに（申請前何か月以内）、資格者による点検が要る看板（高さなど）"
    電話で聞く文: "更新の申請に安全点検の報告書は要りますか。点検は申請の何か月前までのものが有効で、資格者が行う必要がありますか"
    判定に使う入力: [市町村, 種類, 高さ4m超]
  - 番号: U5
    id: 管理者
    群: 更新
    軸: 屋外広告物
    表示名: "管理者の設置"
    資料で探すもの: "管理者を置く義務がある看板（高さ・全ての許可物件）、管理者になれる資格"
    電話で聞く文: "この看板には管理者を置く必要がありますか。管理者になれるのはどんな資格の人ですか"
    判定に使う入力: [市町村, 高さ4m超]
  - 番号: U6
    id: 手数料
    群: 更新
    軸: 屋外広告物
    表示名: "更新の手数料"
    資料で探すもの: "種類・面積ごとの手数料（更新も同じ額か）、1㎡未満の扱い、手数料を定めた条例"
    電話で聞く文: "更新の手数料はいくらですか。新規と同じ額ですか"
    判定に使う入力: [市町村, 種類, 表示面積]
  - 番号: U7
    id: 変更届
    群: 一緒に起きること
    軸: 屋外広告物
    表示名: "表示者・管理者の変更届"
    資料で探すもの: "表示者（設置者）や管理者が変わったときの届出、資格の証明の添付"
    電話で聞く文: "表示者や管理者が変わった場合、更新の前に変更の届出が要りますか"
    判定に使う入力: [表示者の変更]
  - 番号: U8
    id: 板面替え
    群: 一緒に起きること
    軸: 屋外広告物
    表示名: "板面の交換・デザイン変更"
    資料で探すもの: "表示内容の変更が変更の許可になるか、軽微な変更（主たる内容以外・定期的な変更・修繕）で済む範囲"
    電話で聞く文: "更新に合わせて板面のデザインを替える場合、変更の許可は要りますか"
    判定に使う入力: [板面替え]
  - 番号: U9
    id: 旧基準の看板
    群: 一緒に起きること
    軸: 屋外広告物
    表示名: "今の基準に合わない看板の更新"
    資料で探すもの: "基準の改正・地域の指定で今の基準に合わなくなった看板の経過措置（何年まで更新できるか、変更・改造で失われるか）"
    電話で聞く文: "前の基準で許可された看板を、そのまま更新できますか。猶予はいつまでですか"
    判定に使う入力: [市町村]
