# 判定のルール（更新版）：入力の組み合わせ → 観点ごとの3段階（要確認・注意・問題なさそう）と理由1行。
# 道具は断定しない。「問題なさそう」は、根拠の記録（照合が一致、OCRなら人の確認が済）があるときだけ。
#
# 判定の順番（lib/hantei-core.mjs が守る。ルールより先に効く）
#   1. その観点の「判定に使う入力」に「分からない」があれば → 要確認
#   2. 未収録の自治体なら → 要確認（窓口・適用条例は除く）
#   3. 下のルールを上から見て、最初に当てはまったもの
#   4. どれにも当てはまらなければ → 要確認（「資料で判断できる記載がない」）
#   「該当なし」は入力から見て関係しない観点。画面には出さない。
#
# 条件の書き方
#   屋外：屋外広告物の基準の自治体。都道府県の条例なら「広島県」、市の独自条例なら「広島県福山市」
#   入力名: 値 か [値, 値]。表示面積: {超: 10} など数で比べる
#   根拠：data/基準/ の記録 id（自治体名-番号-連番）
入力:
  種類: [ 壁面, 袖, 屋上, 自立, その他 ]
  表示面積: "数（㎡、合計）か 分からない"
  高さ4m超: [ はい, いいえ, 分からない ]
  板面替え: [ しない, 主たる内容以外だけ, 店名・ロゴも替える, 分からない ]
  表示者の変更: [ ない, ある, 分からない ]

判定:
  - 観点: 窓口
    規則:
      - { 屋外: [ 福岡県久留米市 ], 判定: 問題なさそう, 理由: "都市建設部 都市計画課（0942-30-9083）", 根拠: [ 福岡県久留米市-U1-01 ] }
      - { 屋外: [ 福岡県北九州市 ], 判定: 問題なさそう, 理由: "表示場所を管轄する区役所のまちづくり整備課。制度は都市整備局 道路部 管理課（093-582-2271）", 根拠: [ 福岡県北九州市-U1-01, 福岡県北九州市-U1-02 ] }
      - { 屋外: [ 福岡県宗像市 ], 判定: 要確認, 理由: "手引きでは都市建設部 維持管理課 管理係（0940-36-7471）。手引きが古いので課名を確認", 根拠: [ 福岡県宗像市-U1-01 ] }
      - { 屋外: [ 福岡県 ], 判定: 要確認, 理由: "表示・設置する場所の市町村が窓口。担当課は市町村に確認", 根拠: [ 福岡県-U1-01 ] }
      - { 屋外: [ 新潟県新発田市 ], 判定: 問題なさそう, 理由: "建築課 景観行政係（0254-26-3557）", 根拠: [ 新潟県新発田市-U1-01 ] }
