# 判定のルール（更新版）：入力の組み合わせ → 観点ごとの3段階（要確認・注意・問題なさそう）と理由1行。
# 道具は断定しない。「問題なさそう」は、根拠の記録（照合が一致、OCRなら人の確認が済）があるときだけ。
#
# 判定の順番（lib/hantei-core.mjs が守る。ルールより先に効く）
#   1. その観点の「判定に使う入力」に「分からない」があれば → 要確認
#   2. 未収録の自治体なら → 要確認（窓口・適用条例は除く）
#   3. 下のルールを上から見て、最初に当てはまったもの
#   4. どれにも当てはまらなければ → 要確認（「資料で判断できる記載がない」）
#   「該当なし」は入力から見て関係しない観点。画面には出さない。
#
# 条件の書き方
#   屋外：屋外広告物の基準の自治体。都道府県の条例なら「広島県」、市の独自条例なら「広島県福山市」
#   入力名: 値 か [値, 値]。表示面積: {超: 10} など数で比べる
#   根拠：data/基準/ の記録 id（自治体名-番号-連番）
入力:
  種類: [ 壁面, 袖, 屋上, 自立, その他 ]
  表示面積: "数（㎡、合計）か 分からない"
  高さ4m超: [ はい, いいえ, 分からない ]
  板面替え: [ しない, 主たる内容以外だけ, 店名・ロゴも替える, 分からない ]
  表示者の変更: [ ない, ある, 分からない ]

判定:
  - 観点: 窓口
    規則:
      - { 屋外: [ 兵庫県 ], 判定: 要確認, 理由: "許可は場所を管轄する市町長。上の窓口は県の一覧（令和3年4月）なので、課名が今も同じか確認", 根拠: [ 兵庫県-U1-01, 兵庫県-U1-02 ] }
      - { 屋外: [ 静岡県三島市 ], 判定: 問題なさそう, 理由: "都市計画課 歴史・まちづくり係（055-983-2631）", 根拠: [ 静岡県三島市-U1-01 ] }
      - { 屋外: [ 静岡県浜松市 ], 判定: 問題なさそう, 理由: "土地政策課 景観広告グループ（053-457-2344）", 根拠: [ 静岡県浜松市-U1-01 ] }
      - { 屋外: [ 静岡県静岡市 ], 判定: 問題なさそう, 理由: "都市局都市計画部 景観まちづくり課 屋外広告物係（054-221-1123）", 根拠: [ 静岡県静岡市-U1-01 ] }
      - { 屋外: [ 静岡県富士市 ], 判定: 問題なさそう, 理由: "都市整備部 建築土地対策課 土地埋立対策室（0545-55-2796）", 根拠: [ 静岡県富士市-U1-01 ] }
      - { 屋外: [ 静岡県磐田市 ], 判定: 問題なさそう, 理由: "磐田市 都市計画課（0538-37-4907）", 根拠: [ 静岡県-U1-02 ] }
      - { 屋外: [ 静岡県焼津市 ], 判定: 問題なさそう, 理由: "焼津市 都市計画課（054-626-2160）", 根拠: [ 静岡県-U1-03 ] }
      - { 屋外: [ 静岡県 ], 判定: 要確認, 理由: "設置場所の市の担当課（町は土木事務所）。担当課は上の欄か窓口一覧で確認", 根拠: [ 静岡県-U1-01 ] }
      - { 屋外: [ 東京都新宿区 ], 判定: 問題なさそう, 理由: "新宿区 みどり土木部 土木管理課 占用係（都のしおりの窓口一覧）", 根拠: [ 東京都-U1-03 ] }
      - { 屋外: [ 東京都大田区 ], 判定: 問題なさそう, 理由: "大田区 都市基盤整備部 道路課 占用担当（都のしおりの窓口一覧）", 根拠: [ 東京都-U1-04 ] }
      - { 屋外: [ 東京都三鷹市 ], 判定: 問題なさそう, 理由: "三鷹市 都市整備部 道路管理課 管理係（都のしおりの窓口一覧）", 根拠: [ 東京都-U1-05 ] }
      - { 屋外: [ 東京都小平市 ], 判定: 問題なさそう, 理由: "小平市 都市開発部 道路課（都のしおりの窓口一覧）", 根拠: [ 東京都-U1-06 ] }
      - { 屋外: [ 東京都稲城市 ], 判定: 問題なさそう, 理由: "稲城市 都市建設部 まちづくり計画課 開発指導係（都のしおりの窓口一覧）", 根拠: [ 東京都-U1-07 ] }
      - { 屋外: [ 東京都羽村市 ], 判定: 問題なさそう, 理由: "羽村市 まちづくり部 土木課 道路管理係（都のしおりの窓口一覧）", 根拠: [ 東京都-U1-08 ] }
      - { 屋外: [ 東京都 ], 判定: 要確認, 理由: "23区は区、多摩の市は市の屋外広告物担当（電柱・標識・車体利用などは多摩建築指導事務所）", 根拠: [ 東京都-U1-01, 東京都-U1-02 ] }
      - { 屋外: [ 茨城県ひたちなか市 ], 判定: 問題なさそう, 理由: "ひたちなか市 都市計画課（直通029-273-0497）", 根拠: [ 茨城県ひたちなか市-U1-01 ] }
      - { 屋外: [ 茨城県 ], 判定: 要確認, 理由: "申請先は設置場所の市町村。担当課はまだ確かめていない", 根拠: [ 茨城県-U1-01, 茨城県-U2-01 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 問題なさそう, 理由: "都市計画課 都市景観室（支所では受け付けない）", 根拠: [ 岡山県倉敷市-U1-01 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 問題なさそう, 理由: "都市建設部 都市計画課（本庁舎5階）", 根拠: [ 高知県高知市-U1-01 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 問題なさそう, 理由: "開発建築部 建築指導課（屋外広告物担当）。郵送でも受け付ける", 根拠: [ 愛媛県松山市-U1-01 ] }
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "申請は掲出場所の市町の担当課（上の欄）。屋外広告業の登録は県", 根拠: [ 広島県-U1-01, 広島県-U1-02, 広島県-U1-03 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 問題なさそう, 理由: "福山市の土木管理課（松永・北部・神辺・沼隈の地区は各建設産業課）", 根拠: [ 広島県福山市-U1-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 問題なさそう, 理由: "継続許可（更新）は区役所の維持管理課（市から通知書が届く）", 根拠: [ 広島県広島市-U1-01 ] }
  - 観点: 適用条例
    規則:
      - { 屋外: [ 兵庫県 ], 判定: 問題なさそう, 理由: "兵庫県屋外広告物条例がかかる（神戸・姫路・尼崎・明石・西宮・芦屋・豊岡・丹波篠山以外）。申請先は市町", 根拠: [ 兵庫県-U2-01 ] }
      - { 屋外: [ 静岡県富士市 ], 判定: 問題なさそう, 理由: "富士市屋外広告物条例がかかる（県条例ではない）", 根拠: [ 静岡県富士市-U2-01 ] }
      - { 屋外: [ 静岡県 ], 判定: 問題なさそう, 理由: "静岡県屋外広告物条例がかかる（申請先は市）", 根拠: [ 静岡県-U2-01 ] }
      - { 屋外: [ 静岡県富士市, 静岡県静岡市, 静岡県浜松市, 静岡県三島市 ], 判定: 問題なさそう, 理由: "県条例の対象地域ではなく、市の条例・規則による", 根拠: [ 静岡県-U2-01 ] }
      - { 屋外: [ 東京都 ], 判定: 問題なさそう, 理由: "東京都屋外広告物条例がかかる（許可は区・市。八王子市・町田市は市の条例）", 根拠: [ 東京都-U1-01, 東京都-U1-02, 東京都-U2-01 ] }
      - { 屋外: [ 東京都八王子市, 東京都町田市 ], 判定: 問題なさそう, 理由: "市の屋外広告物条例がかかる（都条例ではない）", 根拠: [ 東京都-U2-01, 東京都-U2-02 ] }
      - { 屋外: [ 茨城県 ], 判定: 問題なさそう, 理由: "茨城県屋外広告物条例がかかる。許可・更新の申請先は市町村", 根拠: [ 茨城県-U2-01, 茨城県-U1-01 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 問題なさそう, 理由: "倉敷市屋外広告物条例がかかる（県条例ではない）", 根拠: [ 岡山県倉敷市-U2-01 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 問題なさそう, 理由: "高知市屋外広告物条例がかかる（県条例ではない）", 根拠: [ 高知県高知市-U2-01 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 問題なさそう, 理由: "松山市屋外広告物条例がかかる（県条例ではない）", 根拠: [ 愛媛県松山市-U2-01 ] }
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "広島県屋外広告物条例がかかる（申請先は市町）", 根拠: [ 広島県-U2-01, 広島県-U1-01 ] }
      - { 屋外: [ 広島県福山市, 広島県広島市 ], 判定: 問題なさそう, 理由: "市の屋外広告物条例がかかる（県条例ではない）", 根拠: [ 広島県-U2-01 ] }
  - 観点: 許可期間と更新
    規則:
      - { 屋外: [ 兵庫県 ], 判定: 注意, 理由: "看板・広告塔などは許可2年以内（テント・塀利用などは1年以内）。更新申請は満了の30日前まで。写真は申請3か月以内に撮影", 根拠: [ 兵庫県-U3-01, 兵庫県-U3-02, 兵庫県-U3-03 ] }
      - { 屋外: [ 静岡県三島市 ], 判定: 注意, 理由: "許可は3年以内（通常3年）。満了前に更新。案内は満了の1か月前ごろなので、届いてからだと時間が少ない", 根拠: [ 静岡県三島市-U3-01, 静岡県三島市-U3-02, 静岡県三島市-U3-03 ] }
      - { 屋外: [ 静岡県浜松市 ], 判定: 注意, 理由: "許可は通常2年。満了前に更新申請（約3か月前に市から通知）。申請3か月以内に撮った全景のカラー写真。内容に変更がなければ電子申請も可", 根拠: [ 静岡県浜松市-U3-01, 静岡県浜松市-U3-02, 静岡県浜松市-U3-04, 静岡県浜松市-U3-03 ] }
      - { 屋外: [ 静岡県静岡市 ], 判定: 注意, 理由: "許可は2年以内（工作物確認が要る堅牢な物は3年以内にできる）。満了後も出すなら更新。お知らせは満了の前々月中旬ごろに届く", 根拠: [ 静岡県静岡市-U3-01, 静岡県静岡市-U3-02, 静岡県静岡市-U3-03, 静岡県静岡市-U3-04 ] }
      - { 屋外: [ 静岡県富士市 ], 判定: 注意, 理由: "審査は25日程度。更新でも土地・建物の使用承諾書など（令和6年7月からの必要書類）。許可期間の長さは窓口で確認", 根拠: [ 静岡県富士市-U3-01, 静岡県富士市-U3-02 ] }
      - { 屋外: [ 静岡県 ], 判定: 注意, 理由: "許可は2年以内（工作物確認のあるものは3年にできる）。満了前に申請しないと更新できない。満了の約2か月前に案内が届く。許可までの目安25日", 根拠: [ 静岡県-U3-01, 静岡県-U3-02, 静岡県-U3-03, 静岡県-U3-04 ] }
      - { 屋外: [ 東京都 ], 判定: 注意, 理由: "広告塔・広告板は許可2年以内。満了の10日前までに継続の手続き（新規と同じ窓口、書類各2通）", 根拠: [ 東京都-U3-01, 東京都-U3-02 ] }
      - { 屋外: [ 茨城県ひたちなか市 ], 判定: 注意, 理由: "広告板・広告塔などは許可3年以内。更新は許可期間が満了する2週間前までに申請", 根拠: [ 茨城県ひたちなか市-U3-01, 茨城県-U3-01 ] }
      - { 屋外: [ 茨城県 ], 判定: 注意, 理由: "広告板・広告塔・照明広告などは許可3年以内。続けるなら更新許可の手続き（締切は市町村で確認）", 根拠: [ 茨城県-U3-01, 茨城県-U3-02 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 注意, 理由: "期限満了の10日前までに更新申請。満了の約3か月前に市からお知らせ（必要書類つき）が届く。許可期間の長さはページに無い", 根拠: [ 岡山県倉敷市-U3-01, 岡山県倉敷市-U3-02 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 注意, 理由: "許可は3年以内（可変表示式1年、立看板等6か月）。許可日は月2回（15日・月末）で、申請は約3日前まで", 根拠: [ 高知県高知市-U3-01, 高知県高知市-U3-02 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 注意, 理由: "許可は2年以内（広告幕1年、立看板等60日）。期間満了の10日前までに更新申請（様式第3号、添付はカラー写真で可）", 根拠: [ 愛媛県松山市-U3-01, 愛媛県松山市-U3-02, 愛媛県松山市-U3-03 ] }
      - { 屋外: [ 広島県 ], 判定: 注意, 理由: "許可は1年以内。続けるなら毎年許可申請をし直す（前回と同じ内容なら添付書類を省略できる）", 根拠: [ 広島県-U3-01, 広島県-U3-02 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 注意, 理由: "許可は1年（立看板・のぼり等は1か月）。満了後も出すなら許可更新申請書（2部）", 根拠: [ 広島県福山市-U3-01, 広島県福山市-U3-02 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 注意, 理由: "許可は1年以内。毎年、区役所から届く通知書・納付書で手数料を納め、継続許可を申請", 根拠: [ 広島県広島市-U3-01, 広島県広島市-U3-02 ] }
  - 観点: 点検報告
    規則:
      - { 屋外: [ 兵庫県 ], 条件: { 高さ4m超: いいえ }, 判定: 注意, 理由: "4m以下でも点検は必要で、更新時に自己点検結果報告を出す", 根拠: [ 兵庫県-U4-03 ] }
      - { 屋外: [ 兵庫県 ], 判定: 注意, 理由: "4m超で設置10年以上なら有資格者（屋外広告士・点検技能講習修了者・建築士など）の安全点検結果報告書、それ以外は自己点検結果報告。点検は満了前3か月以内が原則、要改善は直してから", 根拠: [ 兵庫県-U4-01, 兵庫県-U4-02, 兵庫県-U4-03, 兵庫県-U4-04, 兵庫県-U4-05 ] }
      - { 屋外: [ 静岡県三島市 ], 判定: 要確認, 理由: "点検報告書の様式はある。更新のときに付けるかは窓口で確認", 根拠: [ 静岡県三島市-U4-01 ] }
      - { 屋外: [ 静岡県浜松市 ], 判定: 注意, 理由: "更新の提出書類に屋外広告物点検報告書（第5号様式）が入っている", 根拠: [ 静岡県浜松市-U4-01 ] }
      - { 屋外: [ 静岡県静岡市 ], 判定: 注意, 理由: "更新の申請に、申請前3か月以内の安全点検報告書を付ける", 根拠: [ 静岡県静岡市-U4-01 ] }
      - { 屋外: [ 静岡県富士市 ], 判定: 要確認, 理由: "更新のときの点検報告の要否は読んだページに無い", 根拠: [ 静岡県富士市-U4-00 ] }
      - { 屋外: [ 静岡県 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "更新の申請のときに安全点検（報告書）。4m超の堅ろうな広告物は資格者（屋外広告士・点検技能講習修了者など）が点検", 根拠: [ 静岡県-U4-01, 静岡県-U4-02 ] }
      - { 屋外: [ 静岡県 ], 判定: 注意, 理由: "更新の申請のときに安全点検（報告書）。4m以下ならだれでも点検できる", 根拠: [ 静岡県-U4-01, 静岡県-U4-02 ] }
