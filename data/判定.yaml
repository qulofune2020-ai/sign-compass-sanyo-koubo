# 判定のルール（更新版）：入力の組み合わせ → 観点ごとの3段階（要確認・注意・問題なさそう）と理由1行。
# 道具は断定しない。「問題なさそう」は、根拠の記録（照合が一致、OCRなら人の確認が済）があるときだけ。
#
# 判定の順番（lib/hantei-core.mjs が守る。ルールより先に効く）
#   1. その観点の「判定に使う入力」に「分からない」があれば → 要確認
#   2. 未収録の自治体なら → 要確認（窓口・適用条例は除く）
#   3. 下のルールを上から見て、最初に当てはまったもの
#   4. どれにも当てはまらなければ → 要確認（「資料で判断できる記載がない」）
#   「該当なし」は入力から見て関係しない観点。画面には出さない。
#
# 条件の書き方
#   屋外：屋外広告物の基準の自治体。都道府県の条例なら「広島県」、市の独自条例なら「広島県福山市」
#   入力名: 値 か [値, 値]。表示面積: {超: 10} など数で比べる
#   根拠：data/基準/ の記録 id（自治体名-番号-連番）
入力:
  種類: [ 壁面, 袖, 屋上, 自立, その他 ]
  表示面積: "数（㎡、合計）か 分からない"
  高さ4m超: [ はい, いいえ, 分からない ]
  板面替え: [ しない, 主たる内容以外だけ, 店名・ロゴも替える, 分からない ]
  表示者の変更: [ ない, ある, 分からない ]

