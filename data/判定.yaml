# 判定のルール（更新版）：入力の組み合わせ → 観点ごとの3段階（要確認・注意・問題なさそう）と理由1行。
# 道具は断定しない。「問題なさそう」は、根拠の記録（照合が一致、OCRなら人の確認が済）があるときだけ。
#
# 判定の順番（lib/hantei-core.mjs が守る。ルールより先に効く）
#   1. その観点の「判定に使う入力」に「分からない」があれば → 要確認
#   2. 未収録の自治体なら → 要確認（窓口・適用条例は除く）
#   3. 下のルールを上から見て、最初に当てはまったもの
#   4. どれにも当てはまらなければ → 要確認（「資料で判断できる記載がない」）
#   「該当なし」は入力から見て関係しない観点。画面には出さない。
#
# 条件の書き方
#   屋外：屋外広告物の基準の自治体。都道府県の条例なら「広島県」、市の独自条例なら「広島県福山市」
#   入力名: 値 か [値, 値]。表示面積: {超: 10} など数で比べる
#   根拠：data/基準/ の記録 id（自治体名-番号-連番）
入力:
  種類: [ 壁面, 袖, 屋上, 自立, その他 ]
  表示面積: "数（㎡、合計）か 分からない"
  高さ4m超: [ はい, いいえ, 分からない ]
  板面替え: [ しない, 主たる内容以外だけ, 店名・ロゴも替える, 分からない ]
  表示者の変更: [ ない, ある, 分からない ]

判定:
  - 観点: 窓口
    規則:
      - { 屋外: [ 茨城県ひたちなか市 ], 判定: 問題なさそう, 理由: "ひたちなか市 都市計画課（直通029-273-0497）", 根拠: [ 茨城県ひたちなか市-U1-01 ] }
      - { 屋外: [ 茨城県 ], 判定: 要確認, 理由: "申請先は設置場所の市町村。担当課はまだ確かめていない", 根拠: [ 茨城県-U1-01, 茨城県-U2-01 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 問題なさそう, 理由: "都市計画課 都市景観室（支所では受け付けない）", 根拠: [ 岡山県倉敷市-U1-01 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 問題なさそう, 理由: "都市建設部 都市計画課（本庁舎5階）", 根拠: [ 高知県高知市-U1-01 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 問題なさそう, 理由: "開発建築部 建築指導課（屋外広告物担当）。郵送でも受け付ける", 根拠: [ 愛媛県松山市-U1-01 ] }
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "申請は掲出場所の市町の担当課（上の欄）。屋外広告業の登録は県", 根拠: [ 広島県-U1-01, 広島県-U1-02, 広島県-U1-03 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 問題なさそう, 理由: "福山市の土木管理課（松永・北部・神辺・沼隈の地区は各建設産業課）", 根拠: [ 広島県福山市-U1-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 問題なさそう, 理由: "継続許可（更新）は区役所の維持管理課（市から通知書が届く）", 根拠: [ 広島県広島市-U1-01 ] }
  - 観点: 適用条例
    規則:
      - { 屋外: [ 茨城県 ], 判定: 問題なさそう, 理由: "茨城県屋外広告物条例がかかる。許可・更新の申請先は市町村", 根拠: [ 茨城県-U2-01, 茨城県-U1-01 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 問題なさそう, 理由: "倉敷市屋外広告物条例がかかる（県条例ではない）", 根拠: [ 岡山県倉敷市-U2-01 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 問題なさそう, 理由: "高知市屋外広告物条例がかかる（県条例ではない）", 根拠: [ 高知県高知市-U2-01 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 問題なさそう, 理由: "松山市屋外広告物条例がかかる（県条例ではない）", 根拠: [ 愛媛県松山市-U2-01 ] }
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "広島県屋外広告物条例がかかる（申請先は市町）", 根拠: [ 広島県-U2-01, 広島県-U1-01 ] }
      - { 屋外: [ 広島県福山市, 広島県広島市 ], 判定: 問題なさそう, 理由: "市の屋外広告物条例がかかる（県条例ではない）", 根拠: [ 広島県-U2-01 ] }
  - 観点: 許可期間と更新
    規則:
      - { 屋外: [ 茨城県ひたちなか市 ], 判定: 注意, 理由: "広告板・広告塔などは許可3年以内。更新は許可期間が満了する2週間前までに申請", 根拠: [ 茨城県ひたちなか市-U3-01, 茨城県-U3-01 ] }
      - { 屋外: [ 茨城県 ], 判定: 注意, 理由: "広告板・広告塔・照明広告などは許可3年以内。続けるなら更新許可の手続き（締切は市町村で確認）", 根拠: [ 茨城県-U3-01, 茨城県-U3-02 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 注意, 理由: "期限満了の10日前までに更新申請。満了の約3か月前に市からお知らせ（必要書類つき）が届く。許可期間の長さはページに無い", 根拠: [ 岡山県倉敷市-U3-01, 岡山県倉敷市-U3-02 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 注意, 理由: "許可は3年以内（可変表示式1年、立看板等6か月）。許可日は月2回（15日・月末）で、申請は約3日前まで", 根拠: [ 高知県高知市-U3-01, 高知県高知市-U3-02 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 注意, 理由: "許可は2年以内（広告幕1年、立看板等60日）。期間満了の10日前までに更新申請（様式第3号、添付はカラー写真で可）", 根拠: [ 愛媛県松山市-U3-01, 愛媛県松山市-U3-02, 愛媛県松山市-U3-03 ] }
      - { 屋外: [ 広島県 ], 判定: 注意, 理由: "許可は1年以内。続けるなら毎年許可申請をし直す（前回と同じ内容なら添付書類を省略できる）", 根拠: [ 広島県-U3-01, 広島県-U3-02 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 注意, 理由: "許可は1年（立看板・のぼり等は1か月）。満了後も出すなら許可更新申請書（2部）", 根拠: [ 広島県福山市-U3-01, 広島県福山市-U3-02 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 注意, 理由: "許可は1年以内。毎年、区役所から届く通知書・納付書で手数料を納め、継続許可を申請", 根拠: [ 広島県広島市-U3-01, 広島県広島市-U3-02 ] }
  - 観点: 点検報告
    規則:
      - { 屋外: [ 茨城県ひたちなか市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "令和3年10月から、更新のたびに有資格者の点検と報告書。4m超は屋外広告士・点検技能講習修了者・建築士など", 根拠: [ 茨城県ひたちなか市-U4-01, 茨城県-U4-03 ] }
      - { 屋外: [ 茨城県ひたちなか市 ], 判定: 注意, 理由: "令和3年10月から、更新のたびに有資格者の点検と報告書（全ての許可物件）", 根拠: [ 茨城県ひたちなか市-U4-01, 茨城県-U4-02 ] }
      - { 屋外: [ 茨城県 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "更新のたびに有資格者の点検と安全点検報告書。4m超の広告塔・広告板は屋外広告士・点検技能講習修了者・建築士など", 根拠: [ 茨城県-U4-01, 茨城県-U4-02, 茨城県-U4-03 ] }
      - { 屋外: [ 茨城県 ], 判定: 注意, 理由: "更新のたびに点検と安全点検報告書（全ての許可物件が対象）。4m以下は管理者になれる者でも点検可", 根拠: [ 茨城県-U4-01, 茨城県-U4-02, 茨城県-U4-03 ] }
      - { 屋外: [ 岡山県倉敷市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "更新の申請に資格者点検の点検結果報告書と写真（申請日前3か月以内）を付ける", 根拠: [ 岡山県倉敷市-U4-01, 岡山県倉敷市-U5-01 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 注意, 理由: "更新の申請に点検結果報告書（上端4m以下は自己点検で可）と写真（申請日前3か月以内）を付ける", 根拠: [ 岡山県倉敷市-U4-01, 岡山県倉敷市-U4-02 ] }
      - { 屋外: [ 高知県高知市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "更新の申請に安全点検報告書（申請日前3か月以内の点検）。4m超は有資格者が点検し、資格者証の写しを付ける", 根拠: [ 高知県高知市-U4-01, 高知県高知市-U4-02 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 注意, 理由: "更新の申請に安全点検報告書（申請日前3か月以内の点検）。看板の件数分要る", 根拠: [ 高知県高知市-U4-01 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 注意, 理由: "更新のたびに、倒壊・落下のおそれなど安全性を点検して報告する（大きさに関係なく）", 根拠: [ 愛媛県松山市-U4-01, 愛媛県松山市-U4-02 ] }
      - { 屋外: [ 広島県 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "設置から5年たった時点の許可、以降3年ごとに安全点検報告書（資格のある管理者が点検）", 根拠: [ 広島県-U4-01, 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "設置から5年たった時点の許可、以降3年ごとに安全点検報告書（資格のある管理者が点検）", 根拠: [ 広島県-U4-01, 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 判定: 問題なさそう, 理由: "高さ4m以下・10㎡以下なら点検報告の対象外の読み方（設置からの年数は窓口で確認）", 根拠: [ 広島県-U4-02 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "設置6年目の更新から3年ごとに安全点検報告書（許可満了日以前3か月以内のもの）", 根拠: [ 広島県福山市-U4-01, 広島県福山市-U4-02, 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "設置6年目の更新から3年ごとに安全点検報告書（許可満了日以前3か月以内のもの）", 根拠: [ 広島県福山市-U4-01, 広島県福山市-U4-02, 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 判定: 問題なさそう, 理由: "高さ4m以下・10㎡以下なら管理者・点検報告の対象外の読み方", 根拠: [ 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "6年目の継続許可から安全点検報告書。1度出すと次の2年は免除（3年ごと）", 根拠: [ 広島県広島市-U4-01, 広島県広島市-U4-02, 広島県広島市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "6年目の継続許可から安全点検報告書。1度出すと次の2年は免除（3年ごと）", 根拠: [ 広島県広島市-U4-01, 広島県広島市-U4-02, 広島県広島市-U5-01 ] }
      - { 屋外: [ 広島県広島市 ], 判定: 問題なさそう, 理由: "広告塔・広告板で高さ4m以下・10㎡以下なら点検報告の対象外の読み方（アーチ看板は対象）", 根拠: [ 広島県広島市-U5-01 ] }
  - 観点: 管理者
    規則:
      - { 屋外: [ 茨城県 ], 判定: 注意, 理由: "広告板・広告塔など許可期間1年・3年の看板は、申請のときに管理者を定める（登録業者・屋外広告士・講習修了者など）", 根拠: [ 茨城県-U5-01 ] }
      - { 屋外: [ 岡山県倉敷市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "上端4m超は有資格者（屋外広告士・点検技能講習修了者・建築士など）による点検が義務", 根拠: [ 岡山県倉敷市-U5-01 ] }
      - { 屋外: [ 岡山県倉敷市 ], 判定: 要確認, 理由: "上端4m以下の看板の管理者の決まりはページに無い（点検は自己点検で可）", 根拠: [ 岡山県倉敷市-U5-01 ] }
      - { 屋外: [ 高知県高知市 ], 条件: { 表示面積: { 超: 30 } }, 判定: 注意, 理由: "管理者（高知県内在住）を置く。自家用以外で30㎡超は屋外広告士などの資格が要る", 根拠: [ 高知県高知市-U5-01 ] }
      - { 屋外: [ 高知県高知市 ], 判定: 注意, 理由: "管理者（高知県内在住）を置き、申請書の管理者欄に書く", 根拠: [ 高知県高知市-U5-01 ] }
      - { 屋外: [ 愛媛県松山市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "表示面積10㎡超か高さ4m超は管理者を置く（屋外広告士・建築士・電気工事士・講習修了者など）。広告物全体の面積・高さで判断", 根拠: [ 愛媛県松山市-U5-01, 愛媛県松山市-U5-02 ] }
      - { 屋外: [ 愛媛県松山市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "表示面積10㎡超か高さ4m超は管理者を置く（屋外広告士・建築士・電気工事士・講習修了者など）。広告物全体の面積・高さで判断", 根拠: [ 愛媛県松山市-U5-01, 愛媛県松山市-U5-02 ] }
      - { 屋外: [ 愛媛県松山市 ], 判定: 問題なさそう, 理由: "表示面積10㎡以下かつ高さ4m以下なら管理者の設置は不要の読み方（1つの物件に複数の広告物なら全体で判断）", 根拠: [ 愛媛県松山市-U5-01 ] }
      - { 屋外: [ 広島県 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者が点検する（屋外広告士・建築士・電気工事士など）", 根拠: [ 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者が点検する（屋外広告士・建築士・電気工事士など）", 根拠: [ 広島県-U4-02, 広島県-U5-01 ] }
      - { 屋外: [ 広島県 ], 判定: 要確認, 理由: "申請書には管理者を書く。4m以下・10㎡以下で資格が要るかは窓口で確認", 根拠: [ 広島県-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 高さ4m超: はい }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者を置く（屋外広告士・建築士・電気工事士・電気主任技術者・講習修了者）。置いたら設置届", 根拠: [ 広島県福山市-U5-01 ] }
      - { 屋外: [ 広島県福山市 ], 条件: { 表示面積: { 超: 10 } }, 判定: 注意, 理由: "高さ4m超か10㎡超は資格のある管理者を置く（屋外広告士・建築士・電気工事士・電気主任技術者・講習修了者）。置いたら設置届", 根拠: [ 広島県福山市-U5-01 ] }
